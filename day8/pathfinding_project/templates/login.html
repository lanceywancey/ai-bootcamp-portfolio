<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor Login</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            background: #eef2f7;
            color: #172033;
        }
        main {
            width: min(420px, calc(100% - 36px));
            background: white;
            padding: 26px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(20, 32, 55, 0.1);
        }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border-radius: 7px;
            border: 1px solid #c8d1df;
        }
        button {
            margin-top: 12px;
            border: 0;
            background: #2154a3;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }
        .error {
            background: #fff1f1;
            border-left: 4px solid #b23a3a;
            padding: 10px;
        }
        a { display: inline-block; margin-top: 16px; }
    </style>
</head>
<body>
<main>
    <h1>Editor Login</h1>
    <p>Pathfinding is public. Editing requires authorisation.</p>

    {% if error_message %}
    <p class="error">{{ error_message }}</p>
    {% endif %}

    <form method="post">
        <label for="password">Editor password</label>
        <input id="password" name="password" type="password" required>
        <button type="submit">Log in</button>
    </form>

    <a href="{{ url_for('index') }}">Return to public map</a>
</main>
</body>
</html>
